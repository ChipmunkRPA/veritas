[project]
name = "veritas"
dynamic = ["version"]  # app/version.py (D-58)
description = "Veritas: open-source deepfake image/video detection and AI-written-text detection with evidence-backed reports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.16",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "torch>=2.4",
    "torchlibrosa==0.1.0",
    "pyloudnorm==0.1.1",
    "torchvision>=0.19",
    "transformers>=5.5,<6",  # 5.x clears PYSEC-2025-217, PYSEC-2026-2288/2289/2290
    "open_clip_torch>=2.26",
    "timm>=1.0",  # ConvNeXt branch of the Mesorch localiser (I-10); also an open_clip dependency
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "protobuf>=4.25",
    "accelerate>=0.34",
    "grad-cam>=1.5",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "imagehash>=4.3",
    "c2pa-python>=0.6",
    "jpeglib>=1.0.2,<2",  # DCT coefficients for the aligned double-JPEG map (I-4); MPL-2.0, bundles libjpeg
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pysbd>=0.3.4",
    "langid==1.1.6",  # local OCR language coverage gate; recognition is not AI evidence
    "reportlab>=4.2",
    "weasyprint==70.0",  # report engine (ARCHITECTURE §6.1, R-1): exact pin, determinism holds within one engine version; needs Pango
    "pydyf==0.12.1",  # WeasyPrint's PDF writer, pinned with it
    "filetype>=1.2",
    "structlog>=24.4",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",  # Argon2id password hashes for browser sessions (C-1, PL-04)
    "cryptography>=43",  # Ed25519 report and package signatures (D-11, R-4)
]

[project.scripts]
veritas = "app.cli:main"  # `veritas verify <package.zip>` (ARCHITECTURE §6.5)

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.23",  # contract tests validate responses against the published OpenAPI schema (tests/test_api_contract.py)
    "einops>=0.8",  # slow upstream-code comparisons only (tests/test_spai_slow.py)
    "pip-audit>=2.9",  # `make audit` and the release gate (`make ci-release`): the advisories of both runtime locks
]
postgres = ["psycopg[binary]>=3.2"]
eval = ["datasets>=3.0", "scikit-learn>=1.5", "matplotlib>=3.9", "tqdm>=4.66", "pyarrow>=15", "piexif>=1.1.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.detectors.audio" = ["calibrations/*.json"]

[tool.setuptools.dynamic]
version = {attr = "app.version.VERSION"}

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "E741", "SIM117", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # backend/alembic/ holds migration scripts, not the package

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["SIM115", "B007"]  # short-lived CLI scripts; file handles are process-scoped  # long evidence strings are intentional; zip(strict=) noise

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `scripts` is importable in every pytest process, whichever test files it holds (N-4c)
addopts = "-q -m 'not slow and not contract and not bench and not pg'"
markers = [
    "slow: real-model integration tests (run with -m slow)",
    "contract: per-detector contract tests against installed weights (-m contract)",
    "bench: benchmark-backed tests (-m bench)",
    "pg: Postgres tests needing VERITAS_TEST_PG_URL (-m pg)",
    "sqlite_only(reason): the test asserts what only SQLite has; the release gate's run on Postgres skips it with the reason (tests/pg_each_test.py)",
]
