detectors:
  # ---------------------------------------------------------------- image
  - id: img.univfd
    adapter: app.detectors.image.adapters.learned:UnivFDDetector
    version: 0.4.0
    name: UnivFD (CLIP ViT-L/14 linear probe)
    modality: image
    family: learned-whole-image
    hypotheses: [H1_whole_content_synthesis]
    models: [clip.vit_l14_openai, univfd.fc_probe]
    profiles: [full, deep]
    default_enabled: false
    legacy_weight: 1.1
    known_limitations:
      - "rejected on vb-1.0-core (I-14): A2 AUC 0.5065 [0.4382, 0.5875] on its declared threats, and the baseline fuser without it is 4.1 pts better on LGO macro TPR (docs/v2/bench/admissions/baseline-image.md); disabled by default and not in fuser-image-2.0.0-alpha"
      - "weaker on FLUX and Midjourney v6 photoreal stills (v0.3 field test, docs/evaluation.md)"
      - "0.4.0 builds CLIP with QuickGELU (B-4a); 0.3.0 and v0.3 ran standard GELU, so its scores differ from v0.3 (docs/v2/qa/b4a_univfd_quickgelu.md)"
    source_url: https://github.com/WisconsinAIVision/UniversalFakeDetect
    threat: [full_synthesis, gan_face]
    training_data: "ProGAN real/fake images (CNNDetection training set); linear probe on frozen CLIP ViT-L/14 features"
    coverage_date: "2018 (ProGAN training generator); no diffusion or 2025–26 generators in its training data"
    input_constraints: ["224 px crops; v0.3 scores native-resolution crops plus a 1024 px copy for large images"]
    contamination_sets: []
    fp_modes: ["featureless native-resolution crops of large DSLR photos (v0.3 field test; mitigated by multi-scale crops)"]
    citation: "Ojha, Li, Lee. Towards Universal Fake Image Detectors that Generalize Across Generative Models. CVPR 2023."
    admission: {decision: rejected, date: "2026-09-14", evidence: "I-14 (docs/v2/bench/admissions/baseline-image.md and fuser-image-2.0.0-alpha.md, vb-1.0-core fit ∪ cal): A2 AUC 0.5065 on its declared threats (at chance), A3a -4.1 pts fail, A3b fail, A4 fail (R1, R3); decided on fit ∪ cal before the lockbox run; automated record pending human review"}

  - id: img.commfor384
    adapter: app.detectors.image.adapters.learned:CommFor384Detector
    version: 0.4.0
    name: Community Forensics (ViT-S/16, native 384 px crops)
    modality: image
    family: learned-whole-image
    hypotheses: [H1_whole_content_synthesis]
    models: [commfor.vit_s16_384]
    profiles: [quick, full, deep]
    default_enabled: false
    legacy_weight: 0.0
    eval: [{"bench": "vb-1.1", "slice": "image/test", "auc": 0.8834, "tpr_at_fpr01": 0.4036, "ece": 0.2198, "n": 3493, "date": "2026-09-15"}]
    known_limitations:
      - "rejected on vb-1.1 fit ∪ cal under D-53 (J-3c1, docs/v2/bench/admissions/v2.1.1-admissions.md): removed at elimination step 3 (A3a -3.6 pts, lower bound -6.5); the H-4 admission with a JPEG-quality term is superseded. Off by default since fuser-image-2.1.1 (J-5), which does not hold it; its native-frames twin vid.synth.frames.commfor384 feeds the video fusion model (H-8)"
      - "scores native-resolution 384 px crops (centre and four corners, mean logit; ML N2); upstream evaluation resizes the short side to 440 px before a centre crop, so scores on large images differ from the paper's protocol"
      - "images whose short side is below 384 px are not assessed (no upscaling)"
      - "reports an uncalibrated logit, which the legacy fallback fuser does not average"
    source_url: https://github.com/JeongsooP/Community-Forensics
    threat: [full_synthesis]
    training_data: "real and generated images of the Community Forensics training data; the model card lists OwensLab/CommunityForensics (HF dataset card licence cc-by-4.0) and OwensLab/CommunityForensics-Small (cc-by-nc-sa-4.0); effect of the NC-SA set on the weights not established"
    coverage_date: "not established (weights revision 6076002b, upstream code commit ee5b71d4 of 2025-10-18; the generator list in the dataset metadata was not reviewed)"
    input_constraints: ["native-resolution 384 px RGB crops (short side at least 384 px), ImageNet mean and std, float32"]
    contamination_sets: [OwensLab/CommunityForensics-Eval]
    fp_modes: ["stand-alone at its τ_0.05, vb-1.1 fit ∪ cal R1 ∪ R2 reals: 5.2 % (54/1,035; Wilson 4.0–6.7 %); 8.5 % (50/585) at ≥ 8 MP against 0.9 % (4/450) below (H-3, docs/v2/bench/h3_real_fp_analysis.md)"]
    citation: "Community Forensics (Jeongsoo Park and co-authors, OwensLab, CVPR 2025), arXiv 2411.04125, as linked from the model card"
    admission: {decision: rejected, date: "2026-09-17", evidence: "J-3c1 D-44 admission on vb-1.1 fit ∪ cal (docs/v2/bench/admissions/v2.1.1-admissions.md): rejected; A1 pass (parity passed); A2 AUC 0.8591; A3a -3.6 pts; A3b fail; A4 pass; A5 fail: jpeg75 +14.5 pts (n 117), social_ig +15.4 pts (n 117); A6 pass; automated record pending human review"}

  - id: img.dda
    adapter: app.detectors.image.adapters.learned:DDADetector
    version: 0.4.0
    name: DDA (DINOv2 ViT-L/14 + LoRA, native 336 px crops)
    modality: image
    family: learned-whole-image
    hypotheses: [H1_whole_content_synthesis]
    models: [dda.dinov2_vitl14_lora]
    profiles: [full, deep]
    default_enabled: true
    legacy_weight: 0.0
    eval: [{"bench": "vb-1.1", "slice": "image/test", "auc": 0.8879, "tpr_at_fpr01": 0.5037, "ece": 0.0951, "n": 3588, "date": "2026-09-17"}]
    known_limitations:
      - "admitted on vb-1.1 fit ∪ cal under D-53 (J-3c1, docs/v2/bench/admissions/v2.1.1-admissions.md): member of the end set without a gate (A3a +28.8 pts, lower bound +24.3 at elimination step 4); the H-4 JPEG-quality term is void (no fit ∪ cal item carries it). On by default in full and deep and fitted in fuser-image-2.1.1 (J-5); its native-frames twin vid.synth.frames.dda feeds the video fusion model (H-8)"
      - "the upstream README's benchmark accuracies are self-reported and were not reproduced here"
      - "scores native-resolution 336 px crops (centre and four corners, mean logit; ML N2); upstream inference scores one centre 336 px crop, so scores on large images differ from the paper's protocol"
      - "images whose short side is below 336 px are not assessed (upstream CenterCrop pads them; Veritas neither pads nor upscales)"
      - "trained on MSCOCO train2017 photographs: vb reals from coco-val come from another split of the same collection and may score lower than other photographs"
      - "reports an uncalibrated logit, which the legacy fallback fuser does not average"
    source_url: https://github.com/roy-ch/Dual-Data-Alignment
    threat: [full_synthesis]
    training_data: "MSCOCO train2017 photographs against their VAE reconstructions, JPEG-compressed at the paired photograph's quality factor with probability 0.5 (upstream README and Training/); HF dataset Junwei-Xi/DDA-Training-Set (card licence apache-2.0; COCO image licences vary)"
    coverage_date: "not established (weights revision 4390d902, released 2026-02 per the upstream README; trained on VAE reconstructions, not on named generators)"
    input_constraints: ["native-resolution 336 px RGB crops (short side at least 336 px), CLIP mean and std"]
    contamination_sets: [MSCOCO train2017]
