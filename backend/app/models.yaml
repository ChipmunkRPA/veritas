    input_constraints: ["speaking face tracks from vid.tracks.yunet_dinov2 with five landmarks on every tick of a window; a 25 fps tick grid (nearest decoded frame per tick); per tick a 32 × 24 grey mouth patch around the two mouth corners; audio 16 kHz mono, RMS level per 40 ms; 1 s windows every 0.5 s with at least half the ticks speech; full and deep profiles"]
    contamination_sets: []
    fp_modes: ["dubbed or translated films, voice-over, narration and off-screen speakers (VF §4.3)", "multiple speakers where the wrong track is attributed (VF §4.3)", "container mux delay: a constant offset, reported as benign (VF §4.3)", "variable frame-rate phone video with timestamp jitter; frame drops in screen recordings or video calls (VF §4.3)", "profile or occluded mouth (hands, microphone), beards, masks; faces under 96 px; c40-level compression (VF §4.3)", "music or singing, whispering and non-speech vocalisations (VF §4.3)", "head motion, lighting changes or teeth and tongue inside the mouth patch, which move the opening proxy without speech (proxy-specific; not measured)", "rates not established: vb-1.0 real video false-positive rates pending (V-8)"]
