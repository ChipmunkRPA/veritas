name: Public synthetic video colour reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/video-color-replay.yml
      - backend/requirements-video-color-review.txt
      - backend/scripts/diagnose_video_color_v14.py
      - backend/scripts/reproduce_video_color_v14.py

permissions:
  contents: read

jobs:
  colour:
    name: Linux synthetic video colour
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.6"
      - name: Install decoder and array libraries
        run: python -m pip install --isolated --no-cache-dir -r backend/requirements-video-color-review.txt
      - name: Check system video tools
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Run synthetic colour-path experiment
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("torch", "transformers", "fastapi"):
              assert importlib.util.find_spec(name) is None, name
          PY
          python -m scripts.reproduce_video_color_v14 "$RUNNER_TEMP/video-colour-review.json"
      - name: Show completed experiment or explicit failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/video-colour-review.json" ]; then
            cat "$RUNNER_TEMP/video-colour-review.json"
          else
            echo "No completed source experiment. Inspect the failed step; no requirement was relaxed."
          fi
