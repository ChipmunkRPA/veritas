name: Real-text specialist scalar reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/writing-specialists-v5-review.yml
      - backend/scripts/reproduce_writing_specialists_v5.py
      - docs/evaluation-panels/writing-specialists-v5-release.json

permissions:
  contents: read

jobs:
  scalar-refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only the pinned numerical libraries
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.18.1
      - name: Refit all four arms and verify frozen real scalar results
        run: python -m scripts.reproduce_writing_specialists_v5 "$RUNNER_TEMP/real-text-review.json"
