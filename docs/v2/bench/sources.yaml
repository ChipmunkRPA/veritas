# Veritas-Bench vb-1.0 source spec (ML §2.2–2.5, §2.10; D-05, D-13). Read by backend/scripts/vbench_fetch.py.
#
# Every fetchable source declares one access mode, a pinned HF commit, per-source caps, the dataset licence,
# commercial_ok, a group_key rule and quota buckets whose counts are the ML §2.2–2.5 targets split across sources.
# Repo layouts, column names, generator strings and commits were probed on 2026-09-12 through the HF Hub API,
# datasets-server and range reads of zip central directories (probe notes in PROGRESS.md). Values the probes could not
# confirm are marked "U" in the notes; the fetch report records any resulting shortfall.
#
# Non-commercial or undeclared-licence datasets are evaluation and calibration only (D-05); their licence is copied
# into every manifest row. Commons licences are recorded per file.
#
# vb-1.1 (D-40, H-1) is a superset of vb-1.0: VISION natives (R2) and their Facebook / WhatsApp copies (R3), a time-boxed
# Commons R1 / R6 top-up at 1.5 s pacing, FFHQ face reals to 400 and OpenVid-1M reals to 350. The vb-1.0 manifest is kept
# at backend/data/vbench/history/vb-1.0/manifest.parquet (sha256 fc17fe098b69…).

schema_version: 1
bench: vb-1.1
seed: 7

limits:
  max_total_bytes: 55GB    # D-40 (was 40 GB, D-05): total cache (native + norm)
  max_object_bytes: 5GB    # D-05: no object above 5 GB is downloaded whole
  default_max_bytes: 1GB   # ML F3
  min_free_disk_bytes: 100GB  # shared host: stop storing items below 100 GB free (D-40 assumed ≥ 250 GB; 166 GiB measured 2026-09-14)

subsets:
  mini:   # D-13 vb-mini: about 10 % of vb-1.0, same strata
    fraction: 0.1
    min_bytes: 256MB
    max_bytes:   # B-2: sources whose scaled cap stopped before their quotas in the first vb-mini fetch (2026-09-12)
      coco-val: 768MB                 # one row group is 403 MB
      synthbuster-plus-test: 768MB    # 55 / 90 at 231 MB
      sofake-ood-test: 768MB          # 214 / 220 at 563 MB
      rapidata-bananamark: 512MB      # 17 / 21 at 253 MB
      commons-r2-smartphone: 1.5GB    # 37 / 80 at 512 MB (about 14 MB per original)
      commons-video-camera: 1.2GB     # commons-video-general (replaced in B-5): 11 / 20 at 499 MB
      commons-video-speeches: 1GB     # 9 / 15 at 430 MB

exclusions:
  - dataset: bitmind/FaceForensicsC23
    reason: re-upload that bypasses the FaceForensics++ access form (D-05)
  - dataset: l8cv/GenBuster-200K
    reason: bulk only (29 × 4.3 GB multi-part 7z, no member-level random access); GenBuster-200K-mini is allowed (D-05)
  - dataset: faridlab/deepspeak_v2
    reason: manual gating; the loop does not accept dataset terms (D-03)
  - dataset: nuriachandra/Deepfake-Eval-2024
    reason: manual gating (D-03)
  - dataset: ControlNet/LAV-DF
    reason: click-through gating (D-03)
  - dataset: ControlNet/AV-Deepfake1M-PlusPlus
    reason: manual gating (D-03)

sources:
  # =====================================================================================================
  # Images: real strata (ML §2.2, 4,800)
  # =====================================================================================================
  - id: commons-r1-camera
    dataset: wikimedia/commons
    mode: api
    licence: per-file Commons licence
    commercial_ok: true
    modality: image
    api:
      provider: commons
      exif_make: [Canon, SONY, NIKON, OLYMPUS, OM Digital, Panasonic, FUJIFILM]
      max_file_bytes: 40MB
      queries:
        - {category: "Category:Taken with Canon EOS R5", meta: {camera: canon-eos-r5}, max_candidates: 900, max_requests: 40}
        - {category: "Category:Taken with Sony ILCE-7M4", meta: {camera: sony-ilce-7m4}, max_candidates: 900, max_requests: 40}
        # D-40 top-up; category file counts probed 2026-09-14 (V): 22,438 / 5,873 / 5,808 / 6,764 / 6,959 / 2,364
        - {category: "Category:Taken with Canon EOS 5D Mark IV", meta: {camera: canon-eos-5d4}, max_candidates: 1500, max_requests: 30}
        - {category: "Category:Taken with Nikon D850", meta: {camera: nikon-d850}, max_candidates: 1500, max_requests: 30}
        - {category: "Category:Taken with Nikon Z 6", meta: {camera: nikon-z6}, max_candidates: 1500, max_requests: 30}
        - {category: "Category:Taken with Olympus E-M1 Mark II", meta: {camera: olympus-em1ii}, max_candidates: 1500, max_requests: 30}
        - {category: "Category:Taken with Panasonic Lumix DC-G9", meta: {camera: lumix-g9}, max_candidates: 1500, max_requests: 30}
        - {category: "Category:Taken with Fujifilm X-T3", meta: {camera: fujifilm-xt3}, max_candidates: 1500, max_requests: 30}
    pace_s: 1.5  # D-40 top-up pacing (vb-1.0 used 5 s)
    max_items: 649  # vb-1.0 frozen 2026-09-13 at 600 (D-38); D-40 top-up planned +700, time box reached 2026-09-14 at 649 (HTTP 429 throttling)
    frozen: {date: '2026-09-14', decision: D-40, planned_items: 1300}
    max_bytes: 15GB
    avg_item_bytes: 10MB
    max_per_group: 20  # D-40 top-up: vb-1.0 held photographer groups of 185, 126 and 95 items, which unbalanced the splits
    group_key: {field: artist, fallback: pageid}
    quotas:
      - {match: {camera: canon-eos-r5}, n: 300, label: real, threat: real, real_stratum: R1}
      - {match: {camera: sony-ilce-7m4}, n: 300, label: real, threat: real, real_stratum: R1}
      - {match: {camera: canon-eos-5d4}, n: 150, label: real, threat: real, real_stratum: R1}
      - {match: {camera: nikon-d850}, n: 125, label: real, threat: real, real_stratum: R1}
      - {match: {camera: nikon-z6}, n: 125, label: real, threat: real, real_stratum: R1}
      - {match: {camera: olympus-em1ii}, n: 100, label: real, threat: real, real_stratum: R1}
      - {match: {camera: lumix-g9}, n: 100, label: real, threat: real, real_stratum: R1}
      - {match: {camera: fujifilm-xt3}, n: 100, label: real, threat: real, real_stratum: R1}
    notes: >-
      Category sizes 38,623 / 6,235 files (V). Candidates are the first 900 listed files per category, shuffled; files
      without a camera Make EXIF are dropped. Wikimedia throttled 1.1 s pacing during the probe, so requests are 5 s apart.

  - id: synthbuster-plus-test
    dataset: marco-willi/synthbuster-plus
    mode: parquet_stream
    revision: dbfb72f1ee96e953ee5cff80c58832fe89e1d2b5
    licence: none declared (RAISE is research-use; U)
    commercial_ok: false
    modality: image
    files: {pattern: "data/test-*.parquet"}
    parquet:
      columns: {generator: source, image_id: image_id}
      media: [{column: image}]
    max_items: 895
    max_bytes: 3.5GB
    avg_item_bytes: 1.3MB
    group_key: {field: image_id}
    quotas:
      - {match: {generator: raise1k}, n: 200, label: real, threat: real, real_stratum: R1}
      - {match: {generator: FLUX.1-dev}, n: 100, label: fake, threat: t2i, family: flux1}
      - {match: {generator: FLUX.1-schnell}, n: 100, label: fake, threat: t2i, family: flux1}
      - {match: {generator: imagen3}, n: 75, label: fake, threat: t2i, family: imagen3}
      - {match: {generator: SD3-medium}, n: 150, label: fake, threat: t2i, family: sd3}
      - {match: {generator: stable-diffusion-xl}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: stable-diffusion-1-3}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: stable-diffusion-1-4}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: stable-diffusion-2}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: dalle2}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: dalle3}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: firefly}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: midjourney-v5}, n: 30, label: fake, threat: t2i, family: legacy}
      - {match: {generator: glide}, n: 30, label: fake, threat: t2i, family: legacy}
    notes: >-
      Test split 2,800 rows, 9 shards (3.7 GB); 14 sources × 200 rows; image_id repeats across the 14 sources, so it is
      the group key (V).

  - id: commons-r2-smartphone
    dataset: wikimedia/commons
    mode: api
    licence: per-file Commons licence
    commercial_ok: true
    modality: image
    api:
      provider: commons
      exif_make: [samsung, Google, Apple]
      max_file_bytes: 40MB
      queries:
        - {category: "Category:Taken with Samsung Galaxy S24 Ultra", meta: {brand: samsung}, max_candidates: 600, max_requests: 30}
        - {category: "Category:Taken with Google Pixel 9 Pro", meta: {brand: google-pixel9pro}, max_candidates: 600, max_requests: 30}
        - {category: "Category:Taken with Google Pixel 8 Pro", meta: {brand: google-pixel8pro}, max_candidates: 301, max_requests: 20}
        - {category: "Category:Taken with iPhone 15 Pro", meta: {brand: apple-15pro}, max_candidates: 500, max_requests: 30}
        - {category: "Category:Taken with iPhone 15 Pro Max", meta: {brand: apple-15promax}, max_candidates: 500, max_requests: 30}
        - {category: "Category:Taken with iPhone 16 Pro", meta: {brand: apple-16pro}, max_candidates: 500, max_requests: 30}
    pace_s: 5.0
    max_items: 324  # vb-1.0 frozen 2026-09-13 (D-38); planned 800
    frozen: {date: '2026-09-13', decision: D-38, planned_items: 800}
    max_bytes: 5GB
    avg_item_bytes: 5MB
    group_key: {field: artist, fallback: pageid}
    quotas:
      - {match: {brand: samsung}, n: 250, label: real, threat: real, real_stratum: R2}
      - {match: {brand: google-pixel9pro}, n: 150, label: real, threat: real, real_stratum: R2}
      - {match: {brand: google-pixel8pro}, n: 100, label: real, threat: real, real_stratum: R2}
      - {match: {brand: apple-15pro}, n: 100, label: real, threat: real, real_stratum: R2}
      - {match: {brand: apple-15promax}, n: 100, label: real, threat: real, real_stratum: R2}
      - {match: {brand: apple-16pro}, n: 100, label: real, threat: real, real_stratum: R2}
    notes: >-
      ≥ 150 per brand (Samsung 250, Google 250, Apple 300). The Apple categories are named "Taken with iPhone 15 Pro"
      (763), "… 15 Pro Max" (1,336) and "… 16 Pro" (1,712) (V), so they replace ML's random + Make=Apple filter.

  # D-40 (vb-1.1): VISION (Shullani et al. 2017), 35 devices of 11 brands. The index lists 7,565 natural-scene natives
  # (`images/nat/`) and 22,695 platform copies (`natFBH`, `natFBL`, `natWA`: Facebook high / low quality and WhatsApp
  # re-uploads of the same scenes) (V, index read 2026-09-14). Both sources group by device + scene index in the
  # `vision` namespace and visit scenes in the same order, so a copy lands in the same split as its native.
  - id: vision-natives
    dataset: lesc.dinfo.unifi.it/VISION
    mode: url_list
    licence: cc-by-sa-4.0
    commercial_ok: true
    modality: image
    url_list:
      index: https://lesc.dinfo.unifi.it/VISION/VISION_files.txt
      index_sha256: 318ef924c8f5f2403dd4e0ff9708b51c22d53bcee5af81772472c03eb9eadb5e
      base: https://lesc.dinfo.unifi.it/VISION/dataset/
      interleave: device
    path_regex: '^(?P<device>D\d{2})_(?P<model>[^/]+)/images/(?P<platform>nat)/D\d{2}_I_nat_(?P<index>\d{4})\.jpg$'
    pace_s: 0.5
    max_items: 700
    max_bytes: 3GB
    avg_item_bytes: 3MB
    group_key: {field: path, regex: '^(D\d{2})_[^/]+/images/[^/]+/D\d{2}_I_[A-Za-z]+_(\d{4})\.jpg$', namespace: vision, normalise: none}
    quotas:
      - {n: 700, label: real, threat: real, real_stratum: R2}
    notes: >-
      Device-diverse sample: candidates alternate over the 35 devices (about 20 scenes each). Phones from 2012–2016
      (Galaxy S3 … iPhone 6 Plus), so R2 now mixes these natives with the Commons 2023–2024 flagships. Natives are
      2.6–4.6 MB (V, three HEAD requests). Licence CC BY-SA 4.0 (README).

  - id: vision-social
    dataset: lesc.dinfo.unifi.it/VISION
    mode: url_list
    licence: cc-by-sa-4.0
    commercial_ok: true
    modality: image
    url_list:
      index: https://lesc.dinfo.unifi.it/VISION/VISION_files.txt
      index_sha256: 318ef924c8f5f2403dd4e0ff9708b51c22d53bcee5af81772472c03eb9eadb5e
      base: https://lesc.dinfo.unifi.it/VISION/dataset/
      interleave: device
    path_regex: '^(?P<device>D\d{2})_(?P<model>[^/]+)/images/(?P<platform>natFBH|natFBL|natWA)/D\d{2}_I_(?:natFBH|natFBL|natWA)_(?P<index>\d{4})\.jpg$'
    pace_s: 0.5
    max_items: 300
    max_bytes: 512MB
    avg_item_bytes: 300KB
    group_key: {field: path, regex: '^(D\d{2})_[^/]+/images/[^/]+/D\d{2}_I_[A-Za-z]+_(\d{4})\.jpg$', namespace: vision, normalise: none}
    quotas:
      - {match: {platform: natFBH}, n: 100, label: real, threat: real, real_stratum: R3}
      - {match: {platform: natFBL}, n: 100, label: real, threat: real, real_stratum: R3}
      - {match: {platform: natWA}, n: 100, label: real, threat: real, real_stratum: R3}
    notes: >-
      Platform copies of the first scenes per device in the natives' order (about 3 scenes × 35 devices × 3 platforms),
      so every copy shares a group key with a native in vision-natives. A WhatsApp copy is about 270 KB (V, one HEAD).

  - id: sofake-ood-test
    dataset: saberzl/So-Fake-OOD
    mode: parquet_stream
    revision: b4b34d16fda2020c2923a21d431d1ab3acbdbaff
    licence: cc-by-nc-4.0
    commercial_ok: false
    modality: image
    files: {pattern: "data/test_image-*.parquet", sample: 8}
    parquet:
      columns: {label: label, generator: generator, editor: editor, platform: source_platform, post_id: post_id, filename: filename}
      media: [{column: image}]
      row_key: id
    max_items: 2200
    max_bytes: 6GB
    avg_item_bytes: 1.4MB
    group_key: {field: post_id, fallback: filename}
    quotas:
      - {match: {label: REAL, platform: Reddit}, n: 500, label: real, threat: real, real_stratum: R3}
      - {match: {label: REAL, platform: Tumblr}, n: 200, label: real, threat: real, real_stratum: R3}
      - {match: {label: REAL, platform: Bluesky}, n: 200, label: real, threat: real, real_stratum: R3}
      - {match: {label: FULL_SYNTHETIC, generator: FLUX_2}, n: 60, label: fake, threat: t2i, family: flux2, lgo_fold: F2}
      - {match: {label: FULL_SYNTHETIC, generator: Flux.1_pro}, n: 100, label: fake, threat: t2i, family: flux1}
      - {match: {label: FULL_SYNTHETIC, generator: GPT-image-1.5}, n: 60, label: fake, threat: t2i, family: gpt-image-1.5-2, lgo_fold: F3}
      - {match: {label: FULL_SYNTHETIC, generator: GPT-image-2}, n: 60, label: fake, threat: t2i, family: gpt-image-1.5-2, lgo_fold: F3}
      - {match: {label: FULL_SYNTHETIC, generator: GPT4o}, n: 100, label: fake, threat: t2i, family: gpt-4o-image-1}
      - {match: {label: FULL_SYNTHETIC, generator: nano_banana}, n: 60, label: fake, threat: t2i, family: nano-banana, lgo_fold: F4}
      - {match: {label: FULL_SYNTHETIC, generator: nano_banana_2}, n: 60, label: fake, threat: t2i, family: nano-banana, lgo_fold: F4}
      - {match: {label: FULL_SYNTHETIC, generator: seedream4.5}, n: 70, label: fake, threat: t2i, family: seedream4, lgo_fold: F5}
      - {match: {label: FULL_SYNTHETIC, generator: Seedream3.0}, n: 75, label: fake, threat: t2i, family: seedream3}
      - {match: {label: FULL_SYNTHETIC, generator: Imagen4}, n: 100, label: fake, threat: t2i, family: imagen4, lgo_fold: F7}
      - {match: {label: FULL_SYNTHETIC, generator: imagen3}, n: 75, label: fake, threat: t2i, family: imagen3}
      - {match: {label: FULL_SYNTHETIC, generator: Hidream}, n: 100, label: fake, threat: t2i, family: hidream}
      - {match: {label: FULL_SYNTHETIC, generator: Ideogram3}, n: 60, label: fake, threat: t2i, family: ideogram}
      - {match: {label: FULL_SYNTHETIC, generator: Ideogram2}, n: 40, label: fake, threat: t2i, family: ideogram}
      - {match: {label: FULL_SYNTHETIC, generator: Recraftv3}, n: 80, label: fake, threat: t2i, family: recraft}
      - {match: {label: TAMPERED, editor: openai}, n: 150, label: fake, threat: edit, family: partial-edits}
      - {match: {label: TAMPERED, editor: ideogram}, n: 50, label: fake, threat: edit, family: partial-edits}
    notes: >-
      46 shards × about 2.7 GB (V); 8 shards sampled (ML F3 says 6) because Bluesky reals are 1,449 of 91,370 rows.
      post_id was empty in the probe sample, so the group key falls back to the file name. X and Instagram reals are
      link-only and never match. Masks of TAMPERED rows are not stored yet.

  - id: coco-val
