name: Preserved evidence checked-solver review

on:
  workflow_dispatch:
    inputs:
      science_commit:
        description: Immutable commit containing the reviewed v22 scalar release
        required: true
        type: string

permissions:
  contents: read

jobs:
  checked-source-refit:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
      SCIENCE_COMMIT: ${{ inputs.science_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only exact numerical and monitoring dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.18.1 psutil==7.2.2
      - name: Refit every frozen problem and compare the immutable study
        run: |
          python -m scripts.replay_preserved_release_v22 "$SCIENCE_COMMIT" preserved-evidence-v22-linux-${{ matrix.replica }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-evidence-v22-linux-${{ matrix.replica }}
          path: |
            preserved-evidence-v22-linux-${{ matrix.replica }}.json
            chipmunk-preserved-v22-immutable-*/**
