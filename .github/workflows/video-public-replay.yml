name: Public video arithmetic reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/video-public-replay.yml
      - backend/requirements-video-public-review.txt
      - backend/scripts/review_video_demamba_v13.py
      - backend/scripts/review_video_public_v13.py
      - docs/evaluation-panels/video-v13-development-review.json.gz
      - docs/evaluation-panels/video-v13-demamba-freeze.json

permissions:
  contents: read

jobs:
  arithmetic:
    name: Linux video arithmetic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.6"
      - name: Install NumPy only
        run: python -m pip install --isolated --no-cache-dir -r backend/requirements-video-public-review.txt
      - name: Reconstruct the complete public comparison
        run: |
          python - <<'PY'
          import importlib.util, importlib.metadata, json, platform
          for name in ("torch", "transformers", "fastapi", "cv2", "scipy", "sklearn"):
              assert importlib.util.find_spec(name) is None, name
          print(json.dumps({"python": platform.python_version(), "platform": platform.platform(), "numpy": importlib.metadata.version("numpy")}))
          PY
          python -m scripts.review_video_public_v13 review docs/evaluation-panels/video-v13-development-review.json.gz "$RUNNER_TEMP/video-review.json" --freeze docs/evaluation-panels/video-v13-demamba-freeze.json
      - name: Show completed review or explicit failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/video-review.json" ]; then
            cat "$RUNNER_TEMP/video-review.json"
          else
            echo "No completed arithmetic receipt. Inspect the failed step; no requirements were relaxed."
          fi
