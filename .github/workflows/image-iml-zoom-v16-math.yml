name: Image crop projection arithmetic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-grid-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only fixed image arithmetic dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.18.1 Pillow==12.3.0 opencv-python-headless==5.0.0.93
      - name: Check immutable crop and source-group arithmetic without network
        run: |
          python - <<'PY'
          import os, runpy, socket, sys
          def refused(*args, **kwargs):
              raise RuntimeError('No provider or network request during authored review')
          socket.socket.connect = refused
          socket.create_connection = refused
          sys.argv = ['review_image_iml_zoom_public_v16', os.path.join(os.environ['RUNNER_TEMP'], 'image-zoom-v16.json')]
          runpy.run_module('scripts.review_image_iml_zoom_public_v16', run_name='__main__')
          PY
