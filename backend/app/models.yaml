# Veritas detector and weight manifest (ARCHITECTURE §2.3). Schema and lint: app/engine/manifest.py.
#
# - Pins resolved on 2026-09-11. HF revisions are commit shas confirmed through the HF API; every per-file sha256 was
#   hashed locally from the HF cache or backend/data/weights. Non-HF URLs are pinned to a commit or release, and their
#   hashes equal `weights_sha256` in app/core/config.py.
# - Licence classes come from the HF model-card metadata, the GitHub licence API or the model directory LICENSE.
#   A repository without a declared licence is class `unknown` (D-04).
# - Footprints are estimates derived from weight-file sizes (4 bytes per parameter for fp32 stores, 2 for bf16). The
#   ModelManager (F-4) replaces them with measured values.
# - Image detectors have v2 adapters (P-5), including the model-free forensic, metadata and C2PA detectors. Document
#   detectors, the v0.3 video detectors and the voice classifiers have v2 adapters since P-6.
# - `eval` and `validated_slices` are written by vbench_report.py, never by hand. Calibration artefact paths are relative
#   to VERITAS_DATA_DIR.
# - Organika/sdxl-detector was removed (detector survey: PR-AUC at chance on marketplace photos).
