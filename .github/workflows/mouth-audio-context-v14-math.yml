name: Mouth audio correspondence arithmetic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only the fixed numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Verify immutable math with authored signals and no network
        run: |
          python - <<'PY'
          import os, runpy, socket, sys
          def refused(*args, **kwargs):
              raise RuntimeError('No network or provider calls during arithmetic review')
          socket.socket.connect = refused
          socket.create_connection = refused
          sys.argv = ['review_mouth_audio_public_v14', os.path.join(os.environ['RUNNER_TEMP'], 'mouth-audio-v14.json')]
          runpy.run_module('scripts.review_mouth_audio_public_v14', run_name='__main__')
          PY
