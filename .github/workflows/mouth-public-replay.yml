name: Public mouth reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mouth-public-replay.yml
      - backend/requirements-mouth-public-review.txt
      - backend/requirements-audio-public-review.txt
      - backend/scripts/review_mouth_temporal_v12.py
      - backend/scripts/refit_mouth_public_v12.py
      - backend/scripts/review_mouth_temporal_v11.py
      - backend/scripts/review_mouth_context_v10.py
      - docs/evaluation-panels/mouth-v11-fitting-review.json.gz
      - docs/evaluation-panels/mouth-v12-development-review.json.gz
      - docs/evaluation-panels/mouth-v12-execution-freeze.json

permissions:
  contents: read

concurrency:
  group: public-mouth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-replay:
    name: Linux mouth ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [stdlib-arithmetic, numerical-refit]
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.6"
      - name: Install numerical libraries only
        if: matrix.mode == 'numerical-refit'
        run: python -m pip install --isolated --no-cache-dir -r backend/requirements-mouth-public-review.txt
      - name: Reconstruct arithmetic with site packages disabled
        if: matrix.mode == 'stdlib-arithmetic'
        run: python -S -m scripts.review_mouth_temporal_v12 docs/evaluation-panels/mouth-v11-fitting-review.json.gz docs/evaluation-panels/mouth-v12-execution-freeze.json docs/evaluation-panels/mouth-v12-development-review.json.gz "$RUNNER_TEMP/mouth-review.json"
      - name: Require complete fitting-only JSON tree refit
        if: matrix.mode == 'numerical-refit'
        run: |
          python - <<'PY'
          import importlib.util, importlib.metadata, json, platform
          for name in ("torch", "transformers", "fastapi", "cv2"):
              assert importlib.util.find_spec(name) is None, name
          packages = ("numpy", "scipy", "scikit-learn", "joblib", "narwhals", "threadpoolctl", "cloudpickle")
          print(json.dumps({"python": platform.python_version(), "platform": platform.platform(), "versions": {n: importlib.metadata.version(n) for n in packages}}))
          PY
          python -m scripts.review_mouth_temporal_v12 docs/evaluation-panels/mouth-v11-fitting-review.json.gz docs/evaluation-panels/mouth-v12-execution-freeze.json docs/evaluation-panels/mouth-v12-development-review.json.gz "$RUNNER_TEMP/mouth-review.json" --refit
      - name: Show completed receipt or explicit failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mouth-review.json" ]; then
            cat "$RUNNER_TEMP/mouth-review.json"
          else
            echo "No completed review receipt. Inspect the failed step; no checks were relaxed."
          fi
