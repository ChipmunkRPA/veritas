      - "V-5a record (pre-split, every listed vb video item with sound; docs/v2/qa/v5a_lipsync_xcorr.md): assessable on 127 of 255 talking-head fakes and 7 of 45 real videos; lane score AUC 0.657 [0.491, 0.780] (audio-driven generators 0.671 [0.504, 0.803]); flags 67 of 127 fakes and 2 of 7 real videos (28.6 % [8.2, 64.1]); 0 of 7 inserted 300 ms steps found (segment IoU 0); baseline offsets spread over the whole ±15-frame search, so the proxy does not lock onto speech on this footage and DC-04 is not met"
