name: Specialist source-tail scalar comparison

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/specialist-source-tail-v1-review.yml
      - backend/scripts/reproduce_specialist_source_tail_v1.py
      - backend/scripts/replay_frozen_source_tail_v1.py
      - docs/evaluation-panels/specialist-source-tail-v1-release.json

permissions:
  contents: read

jobs:
  scalar-refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only the pinned numerical libraries
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.18.1
      - name: Replay the immutable published study through the corrected wrapper
        run: |
          python -m scripts.replay_frozen_source_tail_v1 "$RUNNER_TEMP/source-tail-review.json"
