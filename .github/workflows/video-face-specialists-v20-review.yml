name: Video face immutable scalar review

on:
  workflow_dispatch:
    inputs:
      science_commit:
        description: Full immutable commit containing the reviewed v20 scalar release
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-source-refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      OPENBLAS_NUM_THREADS: '1'
      SCIENCE_COMMIT: ${{ inputs.science_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install only pinned numerical dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.18.1
      - name: Refit and replay the immutable public video scalar study
        run: |
          python -m scripts.replay_frozen_specialist_release_v5 "$SCIENCE_COMMIT" docs/evaluation-panels/video-face-specialists-v20-release.json video-face-specialists-v20-linux-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: video-face-specialists-v20-linux-review
          path: video-face-specialists-v20-linux-review.json
