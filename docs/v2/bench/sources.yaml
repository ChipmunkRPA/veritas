    path_regex: '^flickr30k-images\.zip/(?:[^/]+/)*(?P<img>\d+)\.jpg$'
    max_items: 200
    max_bytes: 1GB
    avg_item_bytes: 140KB
    group_key: {field: img}
    quotas:
      - {n: 200, label: real, threat: real, real_stratum: R4}
    notes: >-
      The repo ships one 4.39 GB zip plus a CSV; the train/val/test split lives only in the CSV, so members are sampled
      from the whole zip (all real Flickr photographs).

