# Access log without query strings: resource tokens travel as ?token= (EventSource, download links) and must not be logged (Q-2 F2)
log_format veritas_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
# No version in the Server header or on the error pages (N-14c, E-13); this file is read in the http context
server_tokens off;

server {
  # 8080: the image runs nginx as an unprivileged user (frontend/Dockerfile); Compose publishes it as VERITAS_WEB_PORT
  listen 8080;
  access_log /var/log/nginx/access.log veritas_no_query;
  client_max_body_size 512m;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/analyze-text { client_max_body_size 2m; proxy_pass http://api:8160; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
  # SSE (ARCHITECTURE §8.4): pass each event through as it is written. The API sends a comment every 15 s
  # (VERITAS_SSE_HEARTBEAT_S) and closes a stream after VERITAS_SSE_MAX_S (3600 s); clients reconnect with Last-Event-ID.
  location ~ ^/api/v2/analyses/[^/]+/events$ {
    proxy_pass http://api:8160;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3700s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  # Batches (API-01) accept up to VERITAS_BATCH_MAX_BYTES (20 GB) per request
  location /api/v2/batches {
    client_max_body_size 20g;
    proxy_pass http://api:8160;
    proxy_read_timeout 3600s;
    proxy_request_buffering off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  location /api/ {
    proxy_pass http://api:8160;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  # Only BrowserRouter page families may fall back to the shell; dotted model IDs are valid pages.
  location ~ ^/(analyses|cases|batches|models)(/|$)|^/(upload|demo|design|sign-in)/?$ {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
  # A lost navigation (L-7): an address with no file name outside the API, the assets and the page families gets the shell with
  # status 404, so the workspace renders its not-found page. A missing file (any name with a dot) keeps the plain 404 below.
  location ~ ^/(?!api(/|$)|assets(/|$))[^./][^./]*(/[^./][^./]*)*/?$ {
    error_page 404 /index.html;
    try_files $uri =404;
  }
  location = / { rewrite ^ /index.html last; }
  # Revalidate the shell after a release; missing JS/CSS/media must remain a real 404.
  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # PL-04 secure headers for static files; API responses retain their own policy.
  location / {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }
}
