      media: [{column: image}]
      row_key: image_id
    max_items: 300
    max_bytes: 1GB
    avg_item_bytes: 155KB
    group_key: {field: image_id}
    quotas:
      - {n: 300, label: real, threat: real, real_stratum: R4}

  - id: flickr30k
