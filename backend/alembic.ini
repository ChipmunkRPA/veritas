# Alembic CLI configuration: `cd backend && .venv/bin/alembic upgrade head`.
# The API applies migrations itself in `init_db()` (app/storage/migrations.py). The database URL comes from
# VERITAS_DATABASE_URL / VERITAS_DATA_DIR (app.core.config), never from this file.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
