title = "Chipmunk Verify secret scanning"

[extend]
useDefault = true

# Exact public identifiers reviewed during the initial source-release audit.
# These exceptions do not permit credentials elsewhere in these files.
[[allowlists]]
description = "Video detector identifier, not an API key"
condition = "AND"
paths = ['''(^|/)backend/app/engine/stages/video\.py$''']
regexes = ['''^vid\.frames\.dfdc_b7$''']

[[allowlists]]
description = "Documented generated key filename, not key material"
condition = "AND"
paths = ['''(^|/)docs/runbook\.md$''']
regexes = ['''^instance_ed25519\.pem$''']

[[allowlists]]
description = "Demo step identifier, not an API key"
condition = "AND"
paths = ['''(^|/)frontend/src/demo/steps\.ts$''']
regexes = ['''^img2-provenance$''']

# Hashes of verified frozen vision parameters; names include "token" and
# "key" as neural-network terminology. Match only these digest fields.
[[allowlists]]
description = "V8/V9 research frozen-parameter SHA-256 metadata"
condition = "AND"
paths = ['''(^|/)docs/evaluation-panels/mouth-v(?:8|9)-head\.json$''']
regexTarget = "match"
regexes = ['''^backbone\.(?:embeddings\.(?:cls_token|mask_token)|encoder\.layer\.[0-9]\.attention\.attention\.key\.(?:weight|bias))": "[0-9a-f]{64}"$''']

# Every flagged value was independently recomputed from the private source
# connection metadata before this exact field/path exception was introduced.
# The expanded JSON is scanned at this path; raw profile IDs are never exported.
[[allowlists]]
description = "V8 audio public source connection SHA-256 fingerprints"
condition = "AND"
paths = ['''(^|/)docs/evaluation-panels/audio-v8-source-plan\.json$''']
regexTarget = "match"
regexes = ['''^(?:voice_key_sha256|source_key_sha256)": "[0-9a-f]{64}"$''']
