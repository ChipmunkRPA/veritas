title = "Chipmunk Verify secret scanning"

[extend]
useDefault = true

# Keep metadata exceptions on findings for this rule. Global path exceptions
# can skip entire files in the installed scanner.
[[rules]]
id = "generic-api-key"

# Exact public identifiers reviewed during the initial source-release audit.
# These exceptions do not permit credentials elsewhere in these files.
[[rules.allowlists]]
description = "Video detector identifier, not an API key"
condition = "AND"
paths = ['''(^|/)backend/app/engine/stages/video\.py$''']
regexes = ['''^vid\.frames\.dfdc_b7$''']

[[rules.allowlists]]
description = "Documented generated key filename, not key material"
condition = "AND"
paths = ['''(^|/)docs/runbook\.md$''']
regexes = ['''^instance_ed25519\.pem$''']

[[rules.allowlists]]
description = "Demo step identifier, not an API key"
condition = "AND"
paths = ['''(^|/)frontend/src/demo/steps\.ts$''']
regexes = ['''^img2-provenance$''']

# Hashes of verified frozen vision parameters; names include "token" and
# "key" as neural-network terminology. Match only these digest fields.
[[rules.allowlists]]
description = "V8/V9 research frozen-parameter SHA-256 metadata"
condition = "AND"
paths = ['''(^|/)docs/evaluation-panels/mouth-v(?:8|9)-head\.json$''']
regexTarget = "match"
regexes = ['''^backbone\.(?:embeddings\.(?:cls_token|mask_token)|encoder\.layer\.[0-9]\.attention\.attention\.key\.(?:weight|bias))": "[0-9a-f]{64}"$''']

# Every flagged value was independently recomputed from the private source
# connection metadata before this exact field/path exception was introduced.
# The expanded JSON is scanned at this path; raw profile IDs are never exported.
[[rules.allowlists]]
description = "V8 audio public source connection SHA-256 fingerprints"
condition = "AND"
paths = ['''(^|/)docs/evaluation-panels/audio-v8-source-plan\.json$''']
regexTarget = "match"
regexes = ['''^(?:voice_key_sha256|source_key_sha256)": "[0-9a-f]{64}"$''']

# All thirteen initial findings were recomputed from pinned local model assets
# and installed tokenizer implementations. Restrict to exact field/value pairs.
[[rules.allowlists]]
description = "Writing v3 verified tokenizer file SHA-256 commitments"
condition = "AND"
paths = ['''(^|/)backend/scripts/writing_focus_v3\.py$''', '''(^|/)docs/evaluation-panels/writing-v3-focus-freeze\.json$''']
regexTarget = "match"
regexes = [
  '''^tokenizer\.json": "(?:1f33749d010b4d63908e5c174c341622cb45039dd73a139dcd95bd74cc7e304b|2c070ff353c36f85e20919da787a30e1e8e52b626d0e026e044f373378f6d0bf)"$''',
  '''^tokenizer_config\.json": "(?:288b4077af1ffb3beead6d96fccfc93beb2df9b689cbb038c4eb329165efc43a|d8089020d294f20cb21eca751b5f7f68a0b62ea2716a78576cbd587605382432)"$''',
  '''^special_tokens_map\.json": "f23c8e6099631c233c16d9bf8dab198f610826cdd1b358f270f6d55c1863e857"$''',
  '''^transformers\.tokenization_utils_tokenizers": "bf921a160f483c7a32973952ed82a08c7d8982f769726bd220933aae2df98de8"$''',
  '''^transformers\.tokenization_utils_base": "520a914d0dcc873f8c8788e60ad3007f7db032c82c0b2b2c44ee7f44f2cdad8e"$''',
  '''^tokenizers\.tokenizers": "899b244f19f1ddd6506c45ea0f7163f38952f2a552272a687a6ef4b9ddcc7327"$''',
]

# Recomputed from the two pinned tokenizer files used by the omission study.
[[rules.allowlists]]
description = "Writing omission study tokenizer file SHA-256 commitments"
condition = "AND"
paths = ['(^|/)docs/evaluation-panels/writing-omission-attribution-2026-11-13\.json$']
regexTarget = "match"
regexes = [
  '''^tokenizer\.json": "2c070ff353c36f85e20919da787a30e1e8e52b626d0e026e044f373378f6d0bf"$''',
  '''^tokenizer_config\.json": "d8089020d294f20cb21eca751b5f7f68a0b62ea2716a78576cbd587605382432"$''',
]

# Recomputed from the exact acquired v4 tokenizer files before publication.
# Restrict to these three field/value pairs in this one source file.
[[rules.allowlists]]
description = "Writing v4 verified tokenizer file SHA-256 commitments"
condition = "AND"
paths = ['''(^|/)backend/scripts/writing_modernbert_v4\.py$''']
regexTarget = "match"
regexes = [
  '''^tokenizer\.json['"]: ['"]6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30['"]$''',
  '''^tokenizer_config\.json['"]: ['"]c16f1b07f93d05be753ec0acf8cb511d895a8bdb09669f6b156df81e3f96c2eb['"]$''',
  '''^special_tokens_map\.json['"]: ['"]ea97ecdbcc73713039d8d64dbb05e3689495c96657fbd9a18f5bed381be81049['"]$''',
]

# All26 findings in these two receipts were recomputed: tokenizer assets,
# installed tokenizer implementation files and authored synthetic native IDs.
# Match only the11 reviewed field/value pairs, never either complete file.
[[rules.allowlists]]
description = "Writing v4 actual freeze and synthetic token SHA-256 commitments"
condition = "AND"
paths = ['''(^|/)docs/evaluation-panels/writing-v4-modernbert-(?:freeze|synthetic-runtime)\.json$''']
regexTarget = "match"
regexes = [
  '''^tokenizer\.json": "(?:2c070ff353c36f85e20919da787a30e1e8e52b626d0e026e044f373378f6d0bf|6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30)"$''',
  '''^tokenizer_config\.json": "(?:d8089020d294f20cb21eca751b5f7f68a0b62ea2716a78576cbd587605382432|c16f1b07f93d05be753ec0acf8cb511d895a8bdb09669f6b156df81e3f96c2eb)"$''',
  '''^special_tokens_map\.json": "ea97ecdbcc73713039d8d64dbb05e3689495c96657fbd9a18f5bed381be81049"$''',
  '''^transformers\.tokenization_utils_tokenizers": "bf921a160f483c7a32973952ed82a08c7d8982f769726bd220933aae2df98de8"$''',
  '''^transformers\.tokenization_utils_base": "520a914d0dcc873f8c8788e60ad3007f7db032c82c0b2b2c44ee7f44f2cdad8e"$''',
  '''^tokenizers\.tokenizers": "899b244f19f1ddd6506c45ea0f7163f38952f2a552272a687a6ef4b9ddcc7327"$''',
  '''^token_ids_sha256": "(?:cd3e736fa17c4add7fbb306b5f0514fc4530a0c6988d6ec4bfff34c163085f62|735f7a33ce92b4e1692e16a4e021839e900002eabd594726520a70c6ff15fbf7|553149c682a0acd0ca0dde7e15f78bf07c8ae55451790e0b248b1e05e2f3bc40)"$''',
]

