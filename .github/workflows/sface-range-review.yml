name: Face transition final-range review

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sface-range-review.yml
      - backend/scripts/reproduce_sface_result_v16.py
      - docs/evaluation-panels/video-v16-sface-final-ranges.json
      - docs/evaluation-panels/video-v16-sface-range-release.json

permissions:
  contents: read

jobs:
  range-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.6"
      - name: Verify reviewed source and packet bytes
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, pathlib
          release = json.loads(pathlib.Path('docs/evaluation-panels/video-v16-sface-range-release.json').read_text())
          for name, expected in release['files_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          for name in ('torch', 'transformers', 'fastapi', 'numpy', 'PIL'):
              assert importlib.util.find_spec(name) is None, name
          print('Exact reviewed range packet and source hashes; standard library only.')
          PY
      - name: Recompute source ranges and advancement counts
        run: |
          python backend/scripts/reproduce_sface_result_v16.py review \
            docs/evaluation-panels/video-v16-sface-final-ranges.json \
            docs/evaluation-panels/video-v16-sface-panel.json "$RUNNER_TEMP/sface-range-review.json"
      - name: Refuse deliberate packet alterations
        run: |
          python backend/scripts/reproduce_sface_result_v16.py tamper \
            docs/evaluation-panels/video-v16-sface-final-ranges.json \
            docs/evaluation-panels/video-v16-sface-panel.json "$RUNNER_TEMP/sface-range-tamper.json"
      - name: Show receipts or incomplete status
        if: always()
        run: |
          for name in sface-range-review sface-range-tamper; do
            if [ -f "$RUNNER_TEMP/$name.json" ]; then
              cat "$RUNNER_TEMP/$name.json"
            else
              echo "No completed $name receipt; inspect the failed step."
            fi
          done
