name: Public visual native reproduction

on:
  workflow_dispatch:
    inputs:
      science_commit:
        description: Immutable revision containing the unchanged authored WAM experiment and acquisition helper
        required: true
        default: c2ef887cc236490cdf0962f2754edf554d802a27
        type: string

permissions:
  contents: read

concurrency:
  group: public-visual-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCIENCE_COMMIT: ${{ inputs.science_commit }}
      PYTHONPATH: backend
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLCONFIGDIR: /tmp/chipmunk-visual-mpl
    steps:
      - name: Require an immutable study revision
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SCIENCE_COMMIT']), 'A full immutable revision is required'
          PY
      - name: Record setup intent before dependencies or inference
        run: |
          mkdir "$RUNNER_TEMP/visual-public-receipts"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'schema': 'chipmunk.public-visual-linux-intent/1', 'science_commit': os.environ['SCIENCE_COMMIT'],
                     'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'phase': 'before_dependency_setup', 'neural_forwards_at_this_step': 0,
                     'customer_files': 0, 'serving_changed': False}
          Path(os.environ['RUNNER_TEMP'], 'visual-public-receipts', 'intent.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ env.SCIENCE_COMMIT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.6'
      - name: Install the fixed CPU research environment
        run: |
          python -m pip install --isolated --no-cache-dir --only-binary=:all: numpy==2.2.6 scipy==1.18.1 PyYAML==6.0.3 einops==0.8.2 opencv-python-headless==5.0.0.93 Pillow==12.3.0 psutil==7.2.2
          python -m pip install --isolated --no-cache-dir --only-binary=:all: torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the required video codec tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Record the actual source and runtime
        run: |
          test "$(git rev-parse HEAD)" = "$SCIENCE_COMMIT"
          python - <<'PY'
          import importlib.metadata as md, json, os, platform, subprocess
          from pathlib import Path
          import torch
          packages = ['torch', 'torchvision', 'numpy', 'scipy', 'PyYAML', 'einops', 'opencv-python-headless', 'Pillow', 'psutil']
          out = {'schema': 'chipmunk.public-visual-linux-runtime/1', 'science_commit': os.environ['SCIENCE_COMMIT'],
                 'platform': platform.platform(), 'machine': platform.machine(), 'python': platform.python_version(),
                 'packages': {p: md.version(p) for p in packages}, 'cuda_available': torch.cuda.is_available(),
                 'ffmpeg': subprocess.check_output(['ffmpeg', '-version'], text=True).splitlines()[0],
                 'outside_human_reviewers': 0, 'customer_files': 0, 'serving_changed': False}
          assert not out['cuda_available']
          Path(os.environ['RUNNER_TEMP'], 'visual-public-receipts', 'environment.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps(out))
          PY
      - name: Acquire checksum-pinned public MIT source and isolated dependencies
        run: python -m scripts.acquire_public_visual_watermark_v1 "$RUNNER_TEMP/visual-assets"
      - name: Freeze before neural inference
        run: python -m scripts.run_public_visual_watermark_v1 freeze "$RUNNER_TEMP/visual-assets" "$RUNNER_TEMP/visual-assets/source" "$RUNNER_TEMP/visual-study"
      - name: Run the original authored native experiment within its unchanged resource guard
        run: python -m scripts.public_visual_watermark_runtime_v1 run "$RUNNER_TEMP/visual-study/profile" run "$RUNNER_TEMP/visual-study"
      - name: Replay masks, messages, source frames and timestamps without neural inference
        run: python -m scripts.public_visual_watermark_runtime_v1 review "$RUNNER_TEMP/visual-study/audit-profile" "$RUNNER_TEMP/visual-study" "$RUNNER_TEMP/visual-study/audit"
      - name: Collect only explicit non-media receipts
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          target = root / 'visual-public-receipts'
          target.mkdir(exist_ok=True)
          # Never upload private arrays, media, source archives, dependency caches or weights.
          for name in ('freeze.json', 'result.json', 'profile/profile.json', 'profile/worker.log',
                       'audit/audit.json', 'audit-profile/profile.json', 'audit-profile/worker.log'):
              source = root / 'visual-study' / name
              if source.is_file():
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
          source = root / 'visual-assets/acquisition.json'
          if source.is_file():
              shutil.copyfile(source, target / 'acquisition.json')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-visual-native-receipts
          path: ${{ runner.temp }}/visual-public-receipts
          if-no-files-found: error
          retention-days: 14
