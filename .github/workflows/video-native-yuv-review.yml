name: Fixed native YUV decoder comparison

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/video-native-yuv-review.yml
      - backend/requirements-video-color-review.txt
      - backend/scripts/diagnose_video_color_v14.py
      - backend/scripts/reproduce_video_yuv_v15.py

permissions:
  contents: read

jobs:
  yuv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.6"
      - name: Install array and decoder libraries
        run: python -m pip install --isolated --no-cache-dir -r backend/requirements-video-color-review.txt
      - name: Ensure system video tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify fixed native samples and measure renderer differences
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("torch", "transformers", "fastapi"):
              assert importlib.util.find_spec(name) is None, name
          PY
          python -m scripts.reproduce_video_yuv_v15 "$RUNNER_TEMP/native-yuv.json"
      - name: Show receipt or explicit incomplete status
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/native-yuv.json" ]; then
            cat "$RUNNER_TEMP/native-yuv.json"
          else
            echo "No completed native-YUV comparison; inspect the failed step."
          fi
